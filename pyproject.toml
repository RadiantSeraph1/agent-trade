[project]
name = "fxlab"
version = "0.1.0"
description = "Forex research and paper-trading lab (paper only)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
api = ["fastapi>=0.111", "uvicorn>=0.30", "google-auth>=2.30", "requests>=2.31"]
cloud = ["google-cloud-firestore>=2.16", "requests>=2.31"]
dashboard = ["streamlit>=1.36"]
ai = ["google-genai>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
